.ranklint-base:
  image: node:22
  variables:
    PLAYWRIGHT_BROWSERS_PATH: $CI_PROJECT_DIR/.cache/ms-playwright
  cache:
    key: ranklint-playwright
    paths:
      - .cache/ms-playwright
  before_script:
    - corepack enable
    - npx --yes @ranklint/cli --version || npm i -g @ranklint/cli
    - npx playwright install --with-deps chromium

.ranklint-audit:
  extends: .ranklint-base
  script:
    - >
      ranklint audit
      --url "$RANKLINT_URL"
      --reporter junit
      --output ranklint-report.xml
      --json-output ranklint-report.json
  artifacts:
    when: always
    reports:
      junit: ranklint-report.xml
    paths:
      - ranklint-report.xml
      - ranklint-report.json

.ranklint-diff:
  extends: .ranklint-base
  variables:
    RANKLINT_DIFF_BASE: $CI_DEFAULT_BRANCH
  script:
    - >
      ranklint diff
      --base "$RANKLINT_DIFF_BASE"
      --current ranklint-report.json
      --reporter markdown
      --output ranklint-diff.md
      || DIFF_EXIT=$?
    - |
      if [ -n "$RANKLINT_GITLAB_TOKEN" ] && [ -n "$CI_MERGE_REQUEST_IID" ]; then
        curl --silent --request POST \
          --header "PRIVATE-TOKEN: $RANKLINT_GITLAB_TOKEN" \
          --data-urlencode "body@ranklint-diff.md" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/notes" > /dev/null
      fi
    - exit ${DIFF_EXIT:-0}
  artifacts:
    when: always
    paths:
      - ranklint-diff.md

.ranklint-monitor:
  extends: .ranklint-base
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - >
      ranklint audit
      --url "$RANKLINT_URL"
      --reporter json
      --output ranklint-report.json
  artifacts:
    when: always
    paths:
      - ranklint-report.json
