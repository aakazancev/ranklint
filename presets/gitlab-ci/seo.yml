.ranklint-base:
  image: node:22
  variables:
    PLAYWRIGHT_BROWSERS_PATH: $CI_PROJECT_DIR/.cache/ms-playwright
    RANKLINT_PROFILE: ""
  cache:
    key: ranklint-playwright
    paths:
      - .cache/ms-playwright
  before_script:
    - corepack enable
    - npx --yes @ranklint/cli --version || npm i -g @ranklint/cli
    - npx playwright install --with-deps chromium

.ranklint-audit:
  extends: .ranklint-base
  script:
    - >
      ranklint audit
      --url "$RANKLINT_URL"
      --reporter junit
      --output ranklint-report.xml
      --json-output ranklint-report.json
  artifacts:
    when: always
    reports:
      junit: ranklint-report.xml
    paths:
      - ranklint-report.xml
      - ranklint-report.json

.ranklint-diff:
  extends: .ranklint-base
  variables:
    RANKLINT_DIFF_BASE: $CI_DEFAULT_BRANCH
  script:
    - >
      ranklint diff
      --base "$RANKLINT_DIFF_BASE"
      --current ranklint-report.json
      --reporter markdown
      --output ranklint-diff.md
      || DIFF_EXIT=$?
    - |
      if [ -n "$RANKLINT_GITLAB_TOKEN" ] && [ -n "$CI_MERGE_REQUEST_IID" ]; then
        command -v jq > /dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq jq) || true
        NOTES_URL="$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/notes"
        NOTE_ID=""
        PAGE=1
        while command -v jq > /dev/null 2>&1 && [ "$PAGE" -le 10 ]; do
          NOTES=$(curl --silent --header "PRIVATE-TOKEN: $RANKLINT_GITLAB_TOKEN" "$NOTES_URL?per_page=100&page=$PAGE")
          [ "$(echo "$NOTES" | jq 'length')" = "0" ] && break
          NOTE_ID=$(echo "$NOTES" | jq -r 'map(select(.body | startswith("<!-- ranklint-diff -->"))) | .[0].id // empty')
          [ -n "$NOTE_ID" ] && break
          PAGE=$((PAGE + 1))
        done
        if [ -n "$NOTE_ID" ]; then
          curl --silent --request PUT \
            --header "PRIVATE-TOKEN: $RANKLINT_GITLAB_TOKEN" \
            --data-urlencode "body@ranklint-diff.md" \
            "$NOTES_URL/$NOTE_ID" > /dev/null
        else
          curl --silent --request POST \
            --header "PRIVATE-TOKEN: $RANKLINT_GITLAB_TOKEN" \
            --data-urlencode "body@ranklint-diff.md" \
            "$NOTES_URL" > /dev/null
        fi
      fi
    - exit ${DIFF_EXIT:-0}
  artifacts:
    when: always
    paths:
      - ranklint-diff.md

.ranklint-lighthouse:
  extends: .ranklint-base
  script:
    - >
      ranklint lighthouse
      --url "$RANKLINT_URL"
      ${RANKLINT_PROFILE:+--profile "$RANKLINT_PROFILE"}
      --output ranklint-lighthouse.json
  artifacts:
    when: always
    paths:
      - ranklint-lighthouse.json

.ranklint-monitor:
  extends: .ranklint-base
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - >
      ranklint audit
      --url "$RANKLINT_URL"
      --mode monitor
      ${RANKLINT_PROFILE:+--profile "$RANKLINT_PROFILE"}
      --output ranklint-monitor.md
      --json-output ranklint-monitor.json
      --html-output ranklint-monitor.html
  cache:
    - key: ranklint-playwright
      paths:
        - .cache/ms-playwright
    - key: ranklint-monitor-reports
      paths:
        - .ranklint/reports
  artifacts:
    when: always
    paths:
      - ranklint-monitor.md
      - ranklint-monitor.json
      - ranklint-monitor.html

.ranklint-pages:
  image: alpine:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - mkdir -p public
    - cp ranklint-monitor.html public/index.html
    - cp ranklint-monitor.json public/report.json
  artifacts:
    paths:
      - public
