name: ranklint-seo

on:
  workflow_call:
    inputs:
      url:
        description: URL of the deployed environment to audit
        required: true
        type: string
      diff-base-artifact:
        description: Name of the artifact holding the base report (from the default branch run)
        required: false
        type: string
        default: ranklint-report

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -g @ranklint/cli
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ranklint-playwright-${{ runner.os }}
      - run: npx playwright install --with-deps chromium
      - name: Audit
        run: >
          ranklint audit
          --url "${{ inputs.url }}"
          --reporter junit
          --output ranklint-report.xml
          --json-output ranklint-report.json
      - name: Download base report
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ${{ inputs.diff-base-artifact }}
          path: base
      - name: Diff against base
        if: github.event_name == 'pull_request'
        run: >
          ranklint diff
          --base base/ranklint-report.json
          --current ranklint-report.json
          --output ranklint-diff.md
      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const fs = require('fs')
            if (!fs.existsSync('ranklint-diff.md')) return
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: fs.readFileSync('ranklint-diff.md', 'utf8'),
            })
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ranklint-report
          path: |
            ranklint-report.xml
            ranklint-report.json
            ranklint-diff.md
