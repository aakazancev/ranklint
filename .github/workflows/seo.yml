name: ranklint-seo

on:
  workflow_call:
    inputs:
      url:
        description: URL of the deployed environment to audit
        required: true
        type: string
      diff-base-artifact:
        description: Name of the artifact holding the base report (from the default branch run)
        required: false
        type: string
        default: ranklint-report
      lighthouse-profile:
        description: ranklint.config profile with lighthouse enabled; empty skips the Lighthouse job
        required: false
        type: string
        default: ""
      sarif:
        description: Also upload a SARIF report to GitHub Code Scanning (needs security-events write)
        required: false
        type: boolean
        default: false

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -g @ranklint/cli
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ranklint-playwright-${{ runner.os }}
      - run: npx playwright install --with-deps chromium
      - name: Audit
        run: >
          ranklint audit
          --url "${{ inputs.url }}"
          --reporter github
          --json-output ranklint-report.json
      - name: Audit for code scanning
        if: inputs.sarif
        continue-on-error: true
        run: >
          ranklint audit
          --url "${{ inputs.url }}"
          --reporter sarif
          --output ranklint.sarif
      - name: Upload SARIF
        if: inputs.sarif
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ranklint.sarif
          category: ranklint
      - name: Download base report
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ${{ inputs.diff-base-artifact }}
          path: base
      - name: Diff against base
        if: github.event_name == 'pull_request'
        run: >
          ranklint diff
          --base base/ranklint-report.json
          --current ranklint-report.json
          --output ranklint-diff.md
      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const fs = require('fs')
            if (!fs.existsSync('ranklint-diff.md')) return
            const body = fs.readFileSync('ranklint-diff.md', 'utf8')
            const marker = '<!-- ranklint-diff -->'
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })
            const existing = comments.find(c => c.body && c.body.startsWith(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
              return
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            })
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ranklint-report
          path: |
            ranklint-report.json
            ranklint-diff.md

  lighthouse:
    if: inputs.lighthouse-profile != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -g @ranklint/cli
      - run: >
          ranklint lighthouse
          --url "${{ inputs.url }}"
          --profile "${{ inputs.lighthouse-profile }}"
          --output ranklint-lighthouse.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ranklint-lighthouse
          path: ranklint-lighthouse.json
