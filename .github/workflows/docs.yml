name: docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - packages/checks/**
      - scripts/generate-rules-doc.mjs
      - .github/workflows/docs.yml
      - pnpm-lock.yaml
      - package.json
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dev:prepare
      - run: pnpm build
      - run: node scripts/generate-rules-doc.mjs --check
      - run: pnpm docs:generate
        env:
          NUXT_SITE_URL: https://ranklint.dev
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
